name: Generate Star History
on:
  schedule:
    - cron: '0 0 * * *' # 每天自动更新一次
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write # 赋予 Actions 提交写权限

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nicoloboschi/gh-stars@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Chart
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/star-history/data.json .github/star-history/chart.svg
          git diff --cached --quiet || git commit -m 'chore: update star history chart'
          git push
