services:
  compose-craft:
    image: ghcr.io/beacherz/compose-tool:latest
    ghcr.io/beacherz/container_name: compose-toolcompose-tool:latest
    restart: unless-stopped
    ports:
      - "8765:80"
    environment:
      - TZ=Asia/Shanghai
    labels:
      - "com.docker.compose.project=compose-craft"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
